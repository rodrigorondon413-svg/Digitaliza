plugins {
    id 'com.android.application'
}

android {
    namespace 'app.digitaliza'
    compileSdk 35

    defaultConfig {
        applicationId 'app.digitaliza'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('digitaliza.jks')
            storePassword 'digitaliza2026'
            keyAlias 'digitaliza'
            keyPassword 'digitaliza2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
